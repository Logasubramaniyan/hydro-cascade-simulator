name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: constraints-tested.txt
      - name: Install application and development tools
        run: python -m pip install -c constraints-tested.txt -e ".[dev]"
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test physics, scheduling, markets, adapters and CLI
        run: python -m pytest -q --cov=hydrocascade --cov-fail-under=85 --cov-report=xml --junitxml=reports/junit.xml
      - name: Build wheel and source distribution
        run: python -m build
      - name: Offline demonstration
        run: python -m hydrocascade demo --output runs/ci --trials 2 --steps 24 --horizon 6
      - name: Verify committed evidence and headline claims
        run: python tools/check_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            reports/
            coverage.xml
            runs/ci/
            dist/
  latest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
