[build-system]
requires = ["setuptools>=77", "wheel", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-cascade-simulator"
version = "0.2.0"
description = "Auditable cascade simulation, hydro scheduling and small power-market experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Logasubramaniyan"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2", "pandas>=2.0,<3", "matplotlib>=3.7,<4", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1", "build>=1,<2"]

[project.scripts]
hydro-cascade = "hydrocascade.cli:main"

[tool.setuptools.packages.find]
include = ["hydrocascade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
